# main に push されたら Web 版をビルドして GitHub Pages に公開する。
# 公開先: https://wine-5.github.io/kansei-palette/
# 事前設定: リポジトリの Settings → Pages → Source を「GitHub Actions」にする
name: Deploy Web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # Actions タブから手動実行もできるようにする

permissions:
  contents: read
  pages: write
  id-token: write

# 連続で push したときは、実行中の公開を途中で止めずに順番に処理する
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.10  # ローカルの emsdk と揃える(docs/SETUP.md)
          actions-cache-folder: emsdk-cache

      - name: Build
        run: |
          emcc --version
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web --parallel

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build-web/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
