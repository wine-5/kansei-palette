<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KanseiPalette</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
        body { display: flex; align-items: center; justify-content: center; }
        /* canvas の実解像度は InitWindow のサイズ。表示だけ画面に合わせて縮小する */
        canvas.emscripten {
            display: block; border: 0; outline: none;
            max-width: 100vw; max-height: 100vh;
            image-rendering: auto;
        }
        #status {
            position: absolute; color: #ccc; font: 16px sans-serif;
        }
    </style>
</head>
<body>
    <!-- tabindex: キーボード入力を受け取るために canvas がフォーカスを持てるようにする -->
    <canvas class="emscripten" id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div id="status">Loading...</div>
    <script>
        var statusElement = document.getElementById('status');
        var canvasElement = document.getElementById('canvas');
        // itch.io の iframe 内ではクリックするまでキー入力が届かないため、クリックでフォーカスする
        canvasElement.addEventListener('mousedown', function () { canvasElement.focus(); });

        var Module = {
            canvas: canvasElement,
            print: function (text) { console.log(text); },
            printErr: function (text) { console.error(text); },
            setStatus: function (text) {
                // リソース(.data)のダウンロード進捗が渡される。空文字で読み込み完了
                statusElement.textContent = text;
                statusElement.style.display = text ? 'block' : 'none';
            },
            monitorRunDependencies: function (left) {
                if (left === 0) Module.setStatus('');
            }
        };
        window.onerror = function () { Module.setStatus('エラーが発生しました(開発者ツールのコンソールを確認)'); };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
